name: Build language pages

# Only fires when an actual source file changes (template.html, lang/*.json,
# or the build script itself) — never on the generated output files. That's
# what keeps this from looping: the commit this workflow pushes back only
# touches generated files, so it can never re-trigger itself.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "template.html"
      - "lang/**"
      - "build.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build language pages
        run: node build.mjs

      - name: Commit regenerated pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html es/index.html fr/index.html vi/index.html zh/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes after build — template/lang edits already matched committed output."
          else
            git commit -m "Regenerate language pages [skip ci]"
            git push
          fi
