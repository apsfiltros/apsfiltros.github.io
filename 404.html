<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Página não encontrada — APS Filtros</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css?v=859db02371">
</head>
<body>
  <main class="error-page">
    <div>
      <img src="/img/aps.svg" alt="APS Filtros" class="error-logo" width="180" height="62">
      <p class="error-code">404</p>
      <h1 class="error-title">Página não encontrada</h1>
      <p class="error-text">
        A página que você procura não existe ou foi movida. Confira o endereço
        digitado ou volte para a página inicial.
      </p>
      <p class="error-text error-text--secondary" lang="en">
        The page you are looking for doesn't exist or has moved.
      </p>
      <div class="error-actions">
        <a href="/" class="error-back">Voltar para o início</a>
        <a href="/en/" class="error-back error-back--secondary" lang="en">English home page</a>
      </div>
    </div>
  </main>
</body>
</html>
